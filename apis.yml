aid: sovryn
name: Sovryn
description: >-
  Sovryn is a Bitcoin-native, non-custodial decentralized finance (DeFi)
  protocol built on Rootstock (RSK). It offers spot and margin trading,
  perpetual swaps, 0% interest Bitcoin-backed loans (Zero), the Sovryn Dollar
  (DLLR) Bitcoin-backed stablecoin, yield and liquidity pools, and SOV
  governance staking, operating as a DAO. Sovryn also incubated BitcoinOS, a
  zk-powered rollup and multi-VM execution stack for Bitcoin. Developers
  integrate through open-source smart contracts, a GraphQL subgraph, an indexer
  HTTP data API, and first-party JavaScript SDKs published under the @sovryn and
  @sovryn-zero npm scopes.
